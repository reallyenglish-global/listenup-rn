name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Required for signed_bundle: unused Android versionCode checked against Play Console'
        type: string
        required: false
      signed_bundle:
        description: 'Also build a signed AAB (approved release branch only; never upload)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  signed-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_bundle
    uses: ./.github/workflows/google-play.yml
    with:
      version_code: ${{ inputs.version_code }}
      upload: false
    secrets: inherit

  build-preview-apk:
    if: github.event_name != 'workflow_dispatch' || !inputs.signed_bundle
    name: Build preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build preview APK
        run: bash scripts/build-android-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: listenup-preview-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
