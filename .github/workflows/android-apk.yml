name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Required for signed_bundle: unused Android versionCode checked against Play Console'
        type: string
        required: false
      signed_bundle:
        description: 'Also build a signed AAB (main only; never upload)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  signed-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_bundle
    uses: ./.github/workflows/google-play.yml
    with:
      version_code: ${{ inputs.version_code }}
      upload: false
    secrets: inherit

  build-preview-apk:
    if: github.event_name != 'workflow_dispatch' || !inputs.signed_bundle
    name: Build preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build preview APK
        run: bash scripts/build-android-apk.sh

      - name: Checksum preview APK
        working-directory: android/app/build/outputs/apk/release
        run: sha256sum app-release.apk > SHA256SUMS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: listenup-preview-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  android-e2e:
    name: Essential Android E2E
    needs: build-preview-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: listenup-preview-apk-${{ github.sha }}
          path: e2e-apk
      - name: Verify exact-build APK
        working-directory: e2e-apk
        run: sha256sum --check SHA256SUMS
      - name: Install pinned Maestro
        run: |
          curl --fail --location --retry 3 -o maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.9.0/maestro.zip
          printf '%s  maestro.zip\n' 855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd | sha256sum --check
          unzip -q maestro.zip -d "$HOME/maestro-cli"
          echo "$HOME/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed release APK (no Metro, no Play credentials)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/run-android-e2e.sh
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: listenup-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: e2e-results/
          if-no-files-found: warn
          retention-days: 14
