name: Google Play internal draft

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
        required: false
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload an internal-testing DRAFT (first upload must be manual in Play Console)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

# Never cancel a release while Google Play is processing its edit.
concurrency:
  group: listenup-google-play
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' || github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/google-play-internal-drafts' && !inputs.upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: google-play
    outputs:
      upload: ${{ steps.release.outputs.upload }}
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      artifact: listenup-play-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
      aab_sha256: ${{ steps.bundle.outputs.aab_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main ancestry or exact build-only validation branch
        env:
          UPLOAD_INPUT: ${{ inputs.upload }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/ci/google-play-internal-drafts && "$UPLOAD_INPUT" != true ]]; then
            printf 'Signing validation on approved PR branch; Play upload is forbidden.\n'
          else
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; uses packageManager pin
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Validate trigger, version and upload opt-in
        id: release
        env:
          PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
          PLAY_UPLOAD_ENABLED: ${{ vars.PLAY_UPLOAD_ENABLED }}
          PLAY_UPLOAD_REQUESTED: ${{ inputs.upload }}
        run: node scripts/play-release.mjs
      - name: Check signing configuration exists (never print values)
        env:
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing google-play environment secret: %s (see docs/google-play-release.md)\n' "$name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - run: pnpm install --frozen-lockfile
      - name: Release policy and application tests
        run: |
          node --test scripts/tests/play-release.test.mjs
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          pnpm exec jest --ci --runInBand
      - name: Generate native Android project
        env:
          CI: '1'
          NODE_ENV: production
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Fetch checksum-pinned Google bundletool
        env:
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Build and verify signed release AAB
        id: bundle
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_UPLOAD: ${{ steps.release.outputs.upload }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: bash scripts/build-play-bundle.sh
      - name: Save signed bundle, checksum and exact-source metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: listenup-play-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: play-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Release summary
        env:
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          UPLOAD: ${{ steps.release.outputs.upload }}
        run: |
          printf '### ListenUp signed AAB\nVersion code: %s\n\n' "$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$UPLOAD" == 'true' ]]; then
            printf 'Internal draft upload requested; see upload job for actual outcome.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Build only; nothing uploaded.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  upload:
    needs: build
    if: needs.build.outputs.upload == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: google-play
    steps:
      - name: Check Play API credential exists
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            printf 'Missing google-play secret PLAY_SERVICE_ACCOUNT_JSON\n' >&2
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7; same workflow run only
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: play-artifact
      - name: Verify downloaded AAB checksum
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.aab_sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  play-artifact/listenup.aab\n' "$EXPECTED_SHA256" | sha256sum --check
      - name: Upload internal-testing draft (never production)
        id: play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.reallyenglish.listenup
          releaseFiles: play-artifact/listenup.aab
          track: internal
          status: draft
          releaseName: ListenUp ${{ needs.build.outputs.version }} (${{ needs.build.outputs.version_code }})
          changesNotSentForReview: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read back exact internal draft through Play API
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          PLAY_AAB_SHA256: ${{ needs.build.outputs.aab_sha256 }}
        run: python3 scripts/verify-play-upload.py
